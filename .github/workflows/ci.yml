name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::data.table
            any::ggplot2
            any::ggiraph
            any::plotly
            any::DT
            any::testthat
            any::shinytest2

      - name: Rebuild data cache from raw extract
        run: Rscript data-raw/prepare_data.R

      - name: Run unit + app tests
        run: Rscript tests/testthat.R

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t spotify-pulse .
